<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fef5c7">
<title>Blog — AskBanu</title>
<meta name="description" content="Notes on applied AI, data platforms, and shipping real production systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 14 Q10 8 16 8 L48 8 Q54 8 54 14 L54 38 Q54 44 48 44 L28 44 L18 54 L20 44 L16 44 Q10 44 10 38 Z' fill='%23fbd724' stroke='%231f1a0e' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f1a0e; --ink-soft: #3a3322; --cream: #fffbeb; --cream-warm: #fef5c7;
    --yellow: #fbd724; --olive: #6b6330; --rust: #b8541e; --line: rgba(31,26,14,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Instrument Sans', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.6; font-size: 17px; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }
  .back { display: inline-block; margin-bottom: 32px; font-size: 15px; font-weight: 500; color: var(--rust); text-decoration: none; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 40px; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { color: var(--ink-soft); margin-bottom: 10px; }
  .post-card { display: block; padding: 24px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .post-card:first-child { padding-top: 0; }
  .post-date { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--olive); font-weight: 500; }
  .post-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; margin: 6px 0 8px; }
  .post-excerpt { color: var(--ink-soft); font-size: 16px; }
  .empty { color: var(--ink-soft); }
  .ai-note { font-size: 13px; color: var(--olive); margin-bottom: 40px; }
  .featured-tag {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--rust); background: var(--cream-warm); border: 1px solid rgba(184,84,30,0.25);
    border-radius: 999px; padding: 3px 10px; margin-bottom: 8px;
  }
</style>
<script data-goatcounter="https://askbanu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <a href="/" class="back">← AskBanu</a>
  <h1>Blog</h1>
  <p class="sub">Notes on applied AI, data platforms, and shipping real production systems.</p>
  <p class="ai-note">Drafted with AI assistance. The thinking, decisions, and edits are mine.</p>
  <div id="posts"><p class="empty">Loading…</p></div>
</div>

<script>
  fetch('/content/posts.json')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('posts');
      const posts = (data.posts || []).slice().sort((a, b) => {
        const fa = a.featured ? 1 : 0;
        const fb = b.featured ? 1 : 0;
        if (fa !== fb) return fb - fa;
        return new Date(b.date) - new Date(a.date);
      });
      if (posts.length === 0) {
        container.innerHTML = '<p class="empty">No posts yet.</p>';
        return;
      }
      container.innerHTML = posts.map(p => `
        <a class="post-card" href="/blog/post.html?slug=${encodeURIComponent(p.slug)}">
          ${p.featured ? '<span class="featured-tag">★ Featured</span><br>' : ''}
          <div class="post-date">${new Date(p.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
          <div class="post-title">${p.title}</div>
          <p class="post-excerpt">${p.excerpt || ''}</p>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('posts').innerHTML = '<p class="empty">Couldn\'t load posts right now.</p>';
    });
</script>
</body>
</html>
