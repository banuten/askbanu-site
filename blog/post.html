<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fef5c7">
<title id="page-title">Blog — AskBanu</title>
<meta name="description" id="page-description" content="Notes on applied AI, data platforms, and shipping real production systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 14 Q10 8 16 8 L48 8 Q54 8 54 14 L54 38 Q54 44 48 44 L28 44 L18 54 L20 44 L16 44 Q10 44 10 38 Z' fill='%23fbd724' stroke='%231f1a0e' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f1a0e; --ink-soft: #3a3322; --cream: #fffbeb; --cream-warm: #fef5c7;
    --yellow: #fbd724; --olive: #6b6330; --rust: #b8541e; --line: rgba(31,26,14,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Instrument Sans', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.7; font-size: 18px; }
  a { color: var(--rust); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px 100px; }
  .back { display: inline-block; margin-bottom: 32px; font-size: 15px; font-weight: 500; color: var(--rust); text-decoration: none; }
  .post-date { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--olive); font-weight: 500; margin-bottom: 12px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 36px; letter-spacing: -0.02em; margin-bottom: 32px; line-height: 1.2; }
  #content h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 32px 0 12px; }
  #content h3 { font-family: 'Fraunces', serif; font-size: 20px; margin: 28px 0 10px; }
  #content p { margin-bottom: 20px; }
  #content ul, #content ol { margin: 0 0 20px 24px; }
  #content li { margin-bottom: 8px; }
  #content code { background: var(--cream-warm); padding: 2px 6px; border-radius: 4px; font-size: 15px; }
  #content pre { background: var(--ink); color: var(--cream); padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 20px; }
  #content pre code { background: none; padding: 0; color: inherit; }
  #content blockquote { border-left: 3px solid var(--rust); padding-left: 16px; color: var(--ink-soft); margin-bottom: 20px; }
  .empty { color: var(--ink-soft); }
  .like-row { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
  .like-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--cream-warm); border: 1px solid var(--line);
    border-radius: 999px; padding: 12px 22px; font-family: 'Instrument Sans', sans-serif;
    font-size: 16px; font-weight: 500; color: var(--ink); cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .like-btn:hover { transform: translateY(-1px); background: var(--yellow); }
  .like-btn.liked { background: var(--yellow); border-color: var(--rust); }
  .like-btn .heart { font-size: 18px; }
  .like-btn:disabled { cursor: default; opacity: 0.9; }
</style>
<script>
  // Track each blog post as its own page in GoatCounter, keyed by slug,
  // since they all otherwise share the same /blog/post.html path.
  window.goatcounter = {
    path: function() {
      var slug = new URLSearchParams(window.location.search).get('slug');
      return slug ? '/blog/' + slug : '/blog/post';
    }
  };
</script>
<script data-goatcounter="https://askbanu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <a href="/blog/" class="back">← All posts</a>
  <div id="post"><p class="empty">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  fetch('/content/posts.json')
    .then(r => r.json())
    .then(data => {
      const post = (data.posts || []).find(p => p.slug === slug);
      const el = document.getElementById('post');
      if (!post) {
        el.innerHTML = '<p class="empty">Post not found.</p>';
        return;
      }
      document.getElementById('page-title').textContent = post.title + ' — AskBanu';
      if (post.excerpt) document.getElementById('page-description').setAttribute('content', post.excerpt);
      el.innerHTML = `
        <div class="post-date">${new Date(post.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
        <h1>${post.title}</h1>
        <div id="content">${marked.parse(post.body || '')}</div>
        <div class="like-row">
          <button id="like-btn" class="like-btn" onclick="handleLike('${post.slug}')">
            <span class="heart">🤍</span> <span id="like-label">Like this post</span>
          </button>
        </div>
      `;
      initLikeButton(post.slug);
    })
    .catch(() => {
      document.getElementById('post').innerHTML = '<p class="empty">Couldn\'t load this post right now.</p>';
    });

  function likeKey(slug) { return 'askbanu-liked-' + slug; }

  async function initLikeButton(slug) {
    const btn = document.getElementById('like-btn');
    const label = document.getElementById('like-label');
    const heart = btn.querySelector('.heart');
    const alreadyLiked = localStorage.getItem(likeKey(slug)) === 'true';
    try {
      const res = await fetch(`https://api.counterapi.dev/v1/askbanu-likes/${encodeURIComponent(slug)}`);
      const data = await res.json();
      const count = data && typeof data.value === 'number' ? data.value : 0;
      label.textContent = alreadyLiked
        ? `Liked${count ? ' · ' + count : ''}`
        : (count ? `Like this post · ${count}` : 'Like this post');
    } catch (e) {
      label.textContent = alreadyLiked ? 'Liked' : 'Like this post';
    }
    if (alreadyLiked) {
      btn.classList.add('liked');
      btn.disabled = true;
      heart.textContent = '❤️';
    }
  }

  async function handleLike(slug) {
    const btn = document.getElementById('like-btn');
    const label = document.getElementById('like-label');
    const heart = btn.querySelector('.heart');
    if (localStorage.getItem(likeKey(slug)) === 'true') return;
    btn.disabled = true;
    try {
      const res = await fetch(`https://api.counterapi.dev/v1/askbanu-likes/${encodeURIComponent(slug)}/up`);
      const data = await res.json();
      const count = data && typeof data.value === 'number' ? data.value : '';
      label.textContent = `Liked${count !== '' ? ' · ' + count : ''}`;
    } catch (e) {
      label.textContent = 'Liked';
    }
    localStorage.setItem(likeKey(slug), 'true');
    btn.classList.add('liked');
    heart.textContent = '❤️';
  }
</script>
</body>
</html>
