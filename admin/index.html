<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex">
  <title>AskBanu — Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    #admin-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
      display: flex; gap: 8px; align-items: center;
      background: #1f1a0e; padding: 10px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #admin-nav a {
      color: #fffbeb; text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 6px 14px; border-radius: 999px;
    }
    #admin-nav a.active { background: #fbd724; color: #1f1a0e; }
    body { padding-top: 42px; }
  </style>
</head>
<body>
  <div id="admin-nav">
    <a href="/admin/" class="active">📝 Posts</a>
    <a href="/admin/stats.html">📊 Stats</a>
  </div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
